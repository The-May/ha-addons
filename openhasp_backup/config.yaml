name: "OpenHASP Backup"
description: "Simple Full Backup Tool for OpenHASP."
version: "1.0.11"
slug: "openhasp_backup"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7

options:
  ftp_display_host:
    - "ip.of.openhasp.display1"
    - "ip.of.openhasp.display2"
    - "ip.of.openhasp.display3"
  ftp_display_user: "changeme"
  ftp_display_pass: "changeme"
  ftp_display_port: 21
  ftp_display_passive: 50009
  ftp_target_host: "changeme"
  ftp_target_port: 21
  ftp_target_user: "changeme"
  ftp_target_pass: "changeme"
  ftp_target_dir: "media/openhasp_backup"
  webhook_url: "http://ip.of.homeassistant.changeme:8123/api/webhook/webhook-ID-here-changeme"

schema:
  ftp_display_host:
    - str
  ftp_display_user: str
  ftp_display_pass: str
  ftp_display_port: int
  ftp_display_passive: int
  ftp_target_host: str
  ftp_target_port: int
  ftp_target_user: str
  ftp_target_pass: str
  ftp_target_dir: str
  webhook_url: str
