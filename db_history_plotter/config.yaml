name: "DB History Plotter"
description: "Queries HA DB, generates plots as PNG images and offers a web UI to customize each graph."
version: "1.2.1"
slug: "db_history_plotter"
init: false
arch:
  - aarch64
  - amd64

ingress: true
ingress_port: 8099
panel_icon: "mdi:chart-line"
panel_title: "DB History Plotter"

map:
  - media:rw
  - homeassistant_config:ro

options:
  db_type: "mariadb"
  db_host: "core-mariadb"
  db_name: "homeassistant"
  db_user: "homeassistant"
  sqlite_file: "/homeassistant/home-assistant_v2.db"
  db_password: ""
  timezone: "Europe/Berlin"
  webui_port: 8099
  refresh_minutes: 10
  sensors:
    - sensor_id: "sensor.vindstyrka_01_temperature"

schema:
  db_type: "list(sqlite|mariadb)"
  db_host: str
  db_name: str
  db_user: str
  db_password: str
  timezone: str
  sqlite_file: str
  webui_port: "port?"
  refresh_minutes: "int(1,1440)?"
  sensors:
    - sensor_id: str
      hours_back: "int(1,8760)?"
      y_label: "str?"
      plot_title: "str?"